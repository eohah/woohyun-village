*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:620px;margin:0 auto;padding:20px 16px 40px}

button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5;cursor:default}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}

.tree .lf{cursor:pointer;outline:none}.tree .lf .ls{transform-box:fill-box;transform-origin:0 50%;transition:transform .18s}
.tree .lf:hover .ls,.tree .lf:focus-visible .ls{transform:scale(1.08)}
.tree .lf:focus-visible path.lp{stroke:var(--tx);stroke-width:3}
.tree .sw{animation:sway 5s ease-in-out infinite alternate}

@media (prefers-reduced-motion:reduce){.tree .sw{animation:none}.tree .lf .ls{transition:none}}
.tcap{min-height:44px;text-align:center;font-size:13px;color:var(--mut);padding:2px 12px 10px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:100%;background:var(--ac)}
.big{font-size:34px;font-weight:700;text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

.q{font-size:20px;font-weight:700;text-align:center;margin:10px 0}
.cv{border-radius:10px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:6px;font-weight:700;background-size:cover;background-position:center;text-shadow:0 1px 4px rgba(0,0,0,.5);font-size:14px}.cv small{font-weight:400;opacity:.9}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-weight:500}td.n,th.n{text-align:right}tr.me{font-weight:700;color:var(--ac)}

body.tree-on{overflow:hidden;height:100%}
#home{position:fixed;inset:0;z-index:5;overflow:hidden;background:linear-gradient(var(--sky2),var(--sky) 72%,var(--ground))}
#photo{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .5s}
#home.photo #photo{opacity:1}

#menu{position:absolute;inset:0}
#menu svg{display:block;width:100%;height:100%;overflow:visible}
#ttl,#nickBadge{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));background:var(--card);opacity:.92;border:1px solid var(--bd);border-radius:12px;padding:6px 12px;font-size:13px;display:flex;flex-direction:column;line-height:1.3}

.modal{position:fixed;inset:0;z-index:20;background:rgba(10,16,10,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hide{display:none}

.mbox{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;width:min(380px,100%);max-height:88vh;overflow:auto}
.mbox.wide{width:min(560px,100%)}.mbox h2{margin:0 0 6px;font-size:20px}
.tree .sw{animation:sway 5s ease-in-out infinite alternate}
.lf .ls{transform-box:fill-box;transform-origin:0 50%;transition:transform .18s;transform:scale(var(--k,1))}.lf{cursor:pointer;outline:none}
.lf:hover .ls,.lf:focus-visible .ls{transform:scale(calc(var(--k,1)*1.08))}.lf:focus-visible path.lp{stroke:#fff;stroke-width:3}
.sw{animation:sway 5s ease-in-out infinite alternate}

body:not(.tree-on){background:#88b04b}
body:not(.tree-on) main>h1,body:not(.tree-on) #gt,body:not(.tree-on) main>.s{color:#1c2a0e}

.q{font-size:clamp(18px,1.4vw + 14px,25px)}
.big{font-size:clamp(30px,2.2vw + 22px,46px)}

input[type=text]{font-size:16px;min-height:44px}

@media (max-height:560px) and (orientation:landscape){

</style>
</head>

function start(g){

async function endGame(g,sc,note){
  clearInterval(tm);sc=Math.max(0,Math.min(100,Math.round(sc)));
  const prev=myG[g]||0;if(sc>prev)myG[g]=sc;
  const total=Object.values(myG).reduce((a,b)=>a+b,0);
  view(`<b>결과</b><div class="big">${sc}점</div><div class="mut" style="text-align:center">${note||""}${sc>prev?" · 최고 기록 갱신!":""}</div>
  <div id="rk" style="text-align:center;font-weight:700;margin-top:8px"></div><div class="row"><button id="re">다시 하기</button><button class="g" id="hm">홈으로</button></div>`);
  $("re").onclick=()=>start(g);$("hm").onclick=home;
  if(!db||!uid){$("rk").textContent="이 환경에서는 순위가 저장되지 않아요.";return}
  try{
    await db.doc("scores/"+uid).set({name:nick.slice(0,12),g:myG,total,updated:Date.now()});
    const s=await db.collection("scores").limit(500).get();
    const l=s.docs.map(d=>((d.data().g||{})[g])||0).filter(x=>x>0);
    const b=myG[g]||0;
    $("rk").textContent=`내 최고 ${b}점 · 현재 ${l.filter(x=>x>b).length+1}위 / ${l.length}명`;
  }catch(e){$("rk").textContent="순위 저장에 실패했어요."}
}

/* ---- 객관식/주관식 러너 ---- */
function quiz(g,items,sec){
  let i=0,sc=0,hits=0;
  const per=100/items.length;
  function show(){
    if(i>=items.length)return endGame(g,sc,`${hits} / ${items.length} 정답`);
    const it=items[i];
    $("stage").innerHTML=`<div class="mut">${i+1} / ${items.length} · 점수 ${Math.round(sc)}</div><div class="big" id="tt">${sec}</div><div class="bar"><i id="tb"></i></div>
    <div class="q">${it.q}</div>${it.o?`<div class="opts">${it.o.map((o,k)=>`<button class="g" data-k="${k}">${o}</button>`).join("")}</div>`:`<input type="text" id="in" autocomplete="off" placeholder="제목 입력"><div class="row"><button id="ok">제출</button>${it.hint?'<button class="g" id="hb">힌트 보기</button>':''}<button class="g" id="pass">패스</button></div><div id="hn" class="mut" style="margin-top:8px"></div>`}<div id="fb" style="margin-top:10px;font-weight:700"></div>`;
    let done=false;const t0=Date.now();
    const fin=(ok,why)=>{
      if(done)return;done=true;clearInterval(tm);
      const left=Math.max(0,sec-(Date.now()-t0)/1000);
      if(ok){hits++;sc+=per*(0.6+0.4*left/sec)}
      $("fb").innerHTML=ok?`<span class="ok">정답! 🎉</span> · ${it.ans}`:`<span class="bad">${why||"오답"}</span> · 정답: ${it.ans}`;
      document.querySelectorAll("#stage button, #stage input").forEach(x=>x.disabled=true);
      let au,c=3;const lbl=i+1>=items.length?"결과 보기":"다음 문제";const go=()=>{clearInterval(au);i++;show()};const n=document.createElement("button");const tx=()=>n.textContent=`${lbl} · ${c}초 뒤 자동 이동`;tx();n.style.marginTop="10px";n.disabled=false;n.onclick=go;$("fb").appendChild(document.createElement("br"));$("fb").appendChild(n);au=setInterval(()=>{c--;if(c<=0)go();else tx()},1000);
    };
    if(it.o)document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>fin(it.ok(+b.dataset.k)));
    else{$("ok").onclick=()=>{const v=norm($("in").value);if(v)fin(it.ok(v))};$("pass").onclick=()=>fin(false,"패스");if($("hb"))$("hb").onclick=()=>{$("hn").textContent=it.hint;$("hb").disabled=true};$("in").onkeydown=e=>{if(e.key==="Enter")$("ok").click()};$("in").focus()}
    clearInterval(tm);tm=setInterval(()=>{const l=Math.max(0,sec-(Date.now()-t0)/1000);$("tt").textContent=Math.ceil(l);$("tb").style.width=l/sec*100+"%";if(l<=0)fin(false,"시간 초과")},200);
  }
  view("");show();
}

/* ---- 게임들 ---- */
function album(){
  const pool=SONGS.filter(s=>!s.intro);
  quiz("album",sh(pool).slice(0,10).map(s=>{
    const ids=[s.al,...(s.also||[])];
    const opts=sh([A[ids[0]],...sh(ALB.filter(a=>!ids.includes(a.id))).slice(0,3)]);
    return {q:`「${s.t}」이 수록된 곳은?`,o:opts.map(a=>`${a.n} (${a.y})`),ok:k=>ids.includes(opts[k].id),ans:ids.map(i=>`${A[i].n} (${A[i].y})`).join(" / ")};
  }),15);
}
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const cho1=s=>[...s].map(c=>{const n=c.charCodeAt(0)-0xAC00;return n>=0&&n<11172?CHO[n/588|0]:c}).join("");
function cho(){
  const pool=SONGS.filter(s=>/^[가-힣\s]+$/.test(s.t)&&s.t.replace(/\s/g,"").length<=9);
  quiz("cho",sh(pool).slice(0,10).map(s=>{const t=s.t.replace(/\s/g,"");return {q:`${cho1(t)}<div class="mut" style="font-weight:400">${t.length}글자</div>`,hint:`${A[s.al].n} 수록곡 · 첫 글자는 “${t[0]}”`,ok:v=>[s.t,...s.a].some(x=>norm(x)===v),ans:s.t}}),15);
}
function hint(){
  const items=sh(SONGS.filter(s=>s.h)).slice(0,8);let i=0,sc=0,hits=0;
  function show(){
    if(i>=items.length)return endGame("hint",sc*100/96,`${hits} / ${items.length} 정답`);
    const s=items[i];let n=1,done=false,fn=()=>{};const t0=Date.now();
    clearInterval(tm);tm=setInterval(()=>{const l=Math.max(0,15-(Date.now()-t0)/1000);const e=$("tt");if(e){e.textContent=Math.ceil(l);$("tb").style.width=l/15*100+"%"}if(l<=0)fn(false)},200);
    const draw=()=>{$("stage").innerHTML=`<div class="mut">${i+1} / ${items.length} · 점수 ${sc}</div><div class="big" id="tt">15</div><div class="bar"><i id="tb"></i></div><div class="q">이 곡은 무엇일까요?</div>
    <ol>${s.h.slice(0,n).map(h=>`<li>${h}</li>`).join("")}</ol><div class="mut">지금 정답이면 +${[12,8,4][n-1]}점</div>
    <input type="text" id="in" autocomplete="off" placeholder="제목 입력" style="margin-top:8px"><div class="row"><button id="ok">제출</button><button class="g" id="more" ${n>=3?"disabled":""}>힌트 더 보기</button><button class="g" id="pass">패스</button></div><div id="fb" style="margin-top:10px;font-weight:700"></div>`;
      $("in").focus();$("more").onclick=()=>{n++;draw()};

function order(){
  let r=0,sc=0;
  const pool=SONGS.filter(s=>!s.intro);
  const modes=sh([0,1,2,3,Math.random()<.5?2:0]);
  function build(mode){
    if(mode<2){
      const byAl={};sh(pool).forEach(x=>{if(!byAl[x.al])byAl[x.al]=x});
      const set=sh(Object.values(byAl)).slice(0,4).map(x=>({t:x.t,k:A[x.al].d,tag:""}));
      return {set,desc:mode===1,q:mode===1?"최근에 발매된 곡부터 순서대로 고른 뒤 제출하세요":"먼저 발매된 곡부터 순서대로 고른 뒤 제출하세요"};
    }
    const id=sh(Object.keys(TRK))[0],set=sh(TRK[id]).slice(0,4).map(x=>({t:x.t,k:x.k,tag:`${x.k}번 트랙`}));
    return {set,desc:mode===3,q:mode===3?`「${A[id].n}」 트랙리스트 <b>뒤 번호부터</b> 거꾸로 골라 제출하세요`:`「${A[id].n}」 트랙리스트 <b>앞 번호부터</b> 순서대로 골라 제출하세요`};
  }
  function round(){
    clearInterval(tm);
    if(r>=5)return endGame("order",sc,"5라운드 완료 · 맞힌 자리마다 5점");
    const mode=modes[r],{set:items,desc,q}=build(mode);
    const set=sh(items),want=items.slice().sort((x,y)=>desc?y.k-x.k:x.k-y.k);
    let sel=[],done=false;const t0=Date.now();
    $("stage").innerHTML=`<div class="mut">라운드 ${r+1} / 5 · 점수 ${sc}</div><div class="big" id="tt">15</div><div class="bar"><i id="tb"></i></div><div class="q">${q}</div><div class="mut" style="text-align:center">다시 누르면 선택이 취소돼요 · 맞힌 자리마다 5점</div><div class="opts" id="ob"></div><div class="row"><button id="sb" disabled>제출</button><button class="g" id="rb">초기화</button></div><div id="fb" style="margin-top:10px;font-weight:700"></div>`;
    const draw=()=>{
      $("ob").innerHTML="";
      set.forEach((x,i)=>{const b=document.createElement("button");const p=sel.indexOf(i);
        b.className=p<0?"g":"";b.textContent=p<0?x.t:`${p+1}번 · ${x.t}`;b.disabled=done;
        b.onclick=()=>{if(done)return;if(p<0)sel.push(i);else sel.splice(p,1);draw()};$("ob").appendChild(b)});
      $("sb").disabled=done||sel.length<4;
    };
    const submit=(timeout)=>{
      if(done)return;done=true;clearInterval(tm);
      const ok=want.map((w,pos)=>sel[pos]!==undefined&&set[sel[pos]]===w);
      const n=ok.filter(Boolean).length;sc+=n*5;
      draw();$("sb").disabled=true;$("rb").disabled=true;
      $("fb").innerHTML=`<div>${timeout?'<span class="bad">시간 초과</span> · ':''}${n} / 4 자리 정답 · +${n*5}점</div>`
        +want.map((w,pos)=>`<div class="${ok[pos]?"ok":"bad"}" style="font-weight:400">${pos+1}번 ${ok[pos]?"✓":"✗"} ${w.t}${w.tag?` <span class="mut">(${w.tag})</span>`:""}${ok[pos]?"":sel[pos]!==undefined?` <span class="mut">· 내 선택: ${set[sel[pos]].t}</span>`:` <span class="mut">· 선택 안 함</span>`}</div>`).join("");
      let au,c=3;const lbl=r+1>=5?"결과 보기":"다음 라운드";const go=()=>{clearInterval(au);r++;round()};
      const nb=document.createElement("button");const tx=()=>nb.textContent=`${lbl} · ${c}초 뒤 자동 이동`;tx();nb.style.marginTop="10px";nb.onclick=go;$("fb").appendChild(nb);
      au=setInterval(()=>{c--;if(c<=0)go();else tx()},1000);
    };
    $("sb").onclick=()=>submit(false);
    $("rb").onclick=()=>{if(!done){sel=[];draw()}};
    draw();
    tm=setInterval(()=>{const l=Math.max(0,15-(Date.now()-t0)/1000);$("tt").textContent=Math.ceil(l);$("tb").style.width=l/15*100+"%";if(l<=0)submit(true)},200);
  }
  view("");round();
}
function ox(){
  const yr=a=>a.y.slice(0,4),ys=[...new Set(ALB.map(yr))];
  const pool=SONGS.filter(s=>!s.intro);
  const pick=()=>pool[Math.random()*pool.length|0];
  const ids=s=>[s.al,...(s.also||[])];
  const mk=()=>{
    const t=Math.random()*3|0,truth=Math.random()<.5;
    if(t===0){const s=pick(),al=truth?A[sh(ids(s))[0]]:sh(ALB.filter(a=>!ids(s).includes(a.id)))[0];
      return {q:`「${s.t}」은(는) <b>${al.n}</b> 수록곡이다`,truth,ex:`${s.t} → ${ids(s).map(i=>A[i].n).join(" / ")}`}}
    if(t===1){const s=pick(),y0=ids(s).map(i=>yr(A[i])),y=truth?sh(y0)[0]:sh(ys.filter(x=>!y0.includes(x)))[0];
      return {q:`「${s.t}」은(는) <b>${y}년</b>에 발표됐다`,truth,ex:`${s.t} → ${ids(s).map(i=>A[i].y+"년").join(" / ")}`}}
    const [a,b]=sh(ALB).slice(0,2),early=a.d<b.d?a:b,late=early===a?b:a,f=truth?early:late,o=truth?late:early;
    return {q:`<b>${f.n}</b>은(는) <b>${o.n}</b>보다 먼저 발매됐다`,truth,ex:`${early.n}(${early.y}) → ${late.n}(${late.y})`}
  };
  const seen=new Set(),items=[];
  while(items.length<10){const m=mk();if(seen.has(m.q))continue;seen.add(m.q);
    items.push({q:m.q,o:["⭕ O","❌ X"],ok:k=>(k===0)===m.truth,ans:(m.truth?"O":"X")+" · "+m.ex})}
  quiz("ox",items,15);
}
