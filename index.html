<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--card:#222428;--tx:#f0efea;--mut:#9a9992;--ac:#7ba2ff;--ok:#4cc27f;--bad:#ef7a7a;--bd:#34363c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--card:#222428;--tx:#f0efea;--mut:#9a9992;--ac:#7ba2ff;--ok:#4cc27f;--bad:#ef7a7a;--bd:#34363c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:620px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:4px 0 2px}.s,.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5;cursor:default}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gm{text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:12px}.gm b{display:block}.gm span{font-size:12px;color:var(--mut)}.gm i{font-style:normal;font-size:12px;color:var(--ac)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:100%;background:var(--ac)}
.big{font-size:34px;font-weight:700;text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.ok{color:var(--ok)}.bad{color:var(--bad)}.hide{display:none}.opts{display:grid;gap:8px;margin-top:10px}
.q{font-size:20px;font-weight:700;text-align:center;margin:10px 0}
.cv{border-radius:10px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:6px;font-weight:700;background-size:cover;background-position:center;text-shadow:0 1px 4px rgba(0,0,0,.5);font-size:14px}.cv small{font-weight:400;opacity:.9}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mut);font-weight:500}td.n,th.n{text-align:right}tr.me{font-weight:700;color:var(--ac)}
</style>
</head>

let canEdit=!!nick; // 페이지에 다시 접속했을 때만 변경 가능
function saveNick(v){
  nick=v;canEdit=false;try{localStorage.setItem("wh-nick",nick)}catch(e){}
  if(db&&uid&&rows.some(r=>r.id===uid)){
    const total=Object.values(myG).reduce((a,b)=>a+b,0);
    db.doc("scores/"+uid).set({name:nick,g:myG,total,updated:Date.now()}).catch(()=>{});
  }
  drawNick();
}
function drawNick(edit){
  if(!nick)return;const c=$("nickCard");c.innerHTML="";
  if(edit){
    const i=document.createElement("input");i.type="text";i.maxLength=12;i.value=nick;
    const r=document.createElement("div");r.className="row";
    const s=document.createElement("button");s.textContent="저장";

    s.onclick=()=>{const v=i.value.trim().slice(0,12);if(v)saveNick(v)};
    x.onclick=()=>drawNick();
    r.append(s,x);c.append(i,r);i.focus();return;
  }
  const b=document.createElement("b");b.textContent=nick;c.append("닉네임 · ",b);
  if(canEdit){const e=document.createElement("button");e.className="g";e.textContent="변경";e.style.cssText="margin-left:10px;padding:4px 10px;font-size:13px";e.onclick=()=>drawNick(true);c.appendChild(e)}

/* ---- 공통 ---- */
function view(h){$("home").classList.add("hide");$("stage").classList.remove("hide");$("stage").innerHTML=h}
function home(){clearInterval(tm);$("stage").classList.add("hide");$("home").classList.remove("hide");drawMenu()}
function drawMenu(){$("menu").innerHTML=GAMES.map(g=>`<button class="gm" data-g="${g.id}"><b>${g.n}</b><span>${g.d}</span><br><i>내 최고 ${myG[g.id]||0}점</i></button>`).join("");
  $("menu").querySelectorAll("button").forEach(b=>b.onclick=()=>start(b.dataset.g))}
function start(g){
  if(!nick){
    const v=$("nick").value.trim().slice(0,12);
    if(!v){$("msg").textContent="닉네임을 먼저 입력해 주세요.";$("nick").focus();return}
    saveNick(v);
  }({album,cho,hint,order,ox,musical})[g]();
}
async function endGame(g,sc,note){
  clearInterval(tm);sc=Math.max(0,Math.min(100,Math.round(sc)));
  const prev=myG[g]||0;if(sc>prev)myG[g]=sc;
  const total=Object.values(myG).reduce((a,b)=>a+b,0);
  view(`<b>${GAMES.find(x=>x.id===g).n} 결과</b><div class="big">${sc}점</div><div class="mut" style="text-align:center">${note||""}${sc>prev?" · 최고 기록 갱신!":""}</div>
  <div id="rk" style="text-align:center;font-weight:700;margin-top:8px"></div><div class="row"><button id="re">다시 하기</button><button class="g" id="hm">홈으로</button></div>`);
  $("re").onclick=()=>start(g);$("hm").onclick=home;
  if(!db||!uid){$("rk").textContent="이 환경에서는 순위가 저장되지 않아요.";return}
  try{
    await db.doc("scores/"+uid).set({name:nick.slice(0,12),g:myG,total,updated:Date.now()});
    const s=await db.collection("scores").limit(500).get();
    const l=s.docs.map(d=>((d.data().g||{})[g])||0).filter(x=>x>0);
    const b=myG[g]||0;
    $("rk").textContent=`내 최고 ${b}점 · 현재 ${l.filter(x=>x>b).length+1}위 / ${l.length}명`;
  }catch(e){$("rk").textContent="순위 저장에 실패했어요."}
}

/* ---- 객관식/주관식 러너 ---- */
function quiz(g,items,sec){
  let i=0,sc=0,hits=0;
  const per=100/items.length;
  function show(){
    if(i>=items.length)return endGame(g,sc,`${hits} / ${items.length} 정답`);
    const it=items[i];
    $("stage").innerHTML=`<div class="mut">${i+1} / ${items.length} · 점수 ${Math.round(sc)}</div><div class="big" id="tt">${sec}</div><div class="bar"><i id="tb"></i></div>
    <div class="q">${it.q}</div>${it.o?`<div class="opts">${it.o.map((o,k)=>`<button class="g" data-k="${k}">${o}</button>`).join("")}</div>`:`<input type="text" id="in" autocomplete="off" placeholder="제목 입력"><div class="row"><button id="ok">제출</button>${it.hint?'<button class="g" id="hb">힌트 보기</button>':''}<button class="g" id="pass">패스</button></div><div id="hn" class="mut" style="margin-top:8px"></div>`}<div id="fb" style="margin-top:10px;font-weight:700"></div>`;
    let done=false;const t0=Date.now();
    const fin=(ok,why)=>{
      if(done)return;done=true;clearInterval(tm);

    }else{
      const fb=await fbInit();
      if(!fb){clearTimeout(to);$("lb").textContent="순위표 설정이 필요해요. (FIREBASE_CONFIG를 입력해 주세요)";return}
      db=fb.db;uid=fb.uid;
    }
    db.collection("scores").limit(500).onSnapshot(s=>{
      clearTimeout(to);rows=s.docs.map(d=>({id:d.id,...d.data()}));
      const me=rows.find(r=>r.id===uid);if(me&&me.g){myG={...me.g,...myG};drawMenu()}
      if(me&&me.name&&!nick){nick=me.name;canEdit=true;try{localStorage.setItem("wh-nick",nick)}catch(e){}drawNick()}
      renderLb();
    },()=>{$("lb").textContent="순위표를 불러오지 못했어요."});
  }catch(e){$("lb").textContent="순위표를 사용할 수 없는 환경이에요."}
})();
</script>
</body>
</html>
