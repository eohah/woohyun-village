  const cap=$("tcap"),def="";

function capPick(a,n,key,cap){const c={},r=[];for(const x of a){const k=key(x);if((c[k]||0)>=cap)continue;c[k]=(c[k]||0)+1;r.push(x);if(r.length>=n)break}return r}
function spread(a){ // 같은 정답이 연달아 나오지 않게 순서 조정
  const k=x=>String(x.ans!==undefined?x.ans:x.ex||"");
  const okAll=b=>b.every((x,n)=>n===0||k(x)!==k(b[n-1]));
  let best=a.slice();
  for(let t=0;t<80;t++){
    let b=t?sh(a.slice()):a.slice();
    for(let i=1;i<b.length;i++){if(k(b[i])!==k(b[i-1]))continue;
      const j=b.findIndex((x,n)=>n>i&&k(x)!==k(b[i-1])&&k(x)!==k(b[i+1]||""));
      if(j>=0)[b[i],b[j]]=[b[j],b[i]]}
    if(okAll(b))return b;best=b}
  return best}
function quiz(g,items,sec){
  items=spread(items);
  let i=0,sc=0,hits=0;
  const per=100/items.length;

    <div class="q">${it.q}</div>${it.o?`<div class="opts">${it.o.map((o,k)=>`<button class="g" data-k="${k}">${o}</button>`).join("")}</div>`:`<input type="text" id="in" autocomplete="off" placeholder="제목 입력"><div class="row"><button id="ok">제출</button>${it.hint?'<button class="g" id="hb">힌트 보기</button>':''}<button class="g" id="pass">패스</button></div><div id="hn" class="mut" style="margin-top:8px"></div>`}<div id="fb" style="margin-top:10px;font-weight:700"></div>`;
    let done=false;const t0=Date.now();

      document.querySelectorAll("#stage button, #stage input").forEach(x=>x.disabled=true);
      let au,c=3;const lbl=i+1>=items.length?"결과 보기":"다음 문제";const go=()=>{clearInterval(au);i++;show()};const n=document.createElement("button");const tx=()=>n.textContent=`${lbl} · ${c}초 뒤 자동 이동`;tx();n.style.marginTop="10px";n.disabled=false;n.onclick=go;$("fb").appendChild(document.createElement("br"));$("fb").appendChild(n);au=setInterval(()=>{c--;if(c<=0)go();else tx()},1000);

    else{$("ok").onclick=()=>{const v=norm($("in").value);if(v)fin(it.ok(v))};$("pass").onclick=()=>fin(false,"패스");if($("hb"))$("hb").onclick=()=>{$("hn").textContent=it.hint;$("hb").disabled=true};$("in").onkeydown=e=>{if(e.key==="Enter")$("ok").click()};$("in").focus()}
    clearInterval(tm);tm=setInterval(()=>{const l=Math.max(0,sec-(Date.now()-t0)/1000);$("tt").textContent=Math.ceil(l);$("tb").style.width=l/sec*100+"%";if(l<=0)fin(false,"시간 초과")},200);
  }

function order(){

  const modes=sh([0,1,2,3,Math.random()<.5?2:0]);
  function build(mode){
    if(mode<2){
      const byAl={};sh(pool).forEach(x=>{if(!byAl[x.al])byAl[x.al]=x});
      const set=sh(Object.values(byAl)).slice(0,4).map(x=>({t:x.t,k:A[x.al].d,tag:""}));
      return {set,desc:mode===1,q:mode===1?"최근에 발매된 곡부터 순서대로 고른 뒤 제출하세요":"먼저 발매된 곡부터 순서대로 고른 뒤 제출하세요"};
    }
    const id=sh(Object.keys(TRK))[0],set=sh(TRK[id]).slice(0,4).map(x=>({t:x.t,k:x.k,tag:`${x.k}번 트랙`}));
    return {set,desc:mode===3,q:mode===3?`「${A[id].n}」 트랙리스트 <b>뒤 번호부터</b> 거꾸로 골라 제출하세요`:`「${A[id].n}」 트랙리스트 <b>앞 번호부터</b> 순서대로 골라 제출하세요`};

  function round(){
    clearInterval(tm);
    if(r>=5)return endGame("order",sc,"5라운드 완료 · 맞힌 자리마다 5점");
    const mode=modes[r],{set:items,desc,q}=build(mode);
    const set=sh(items),want=items.slice().sort((x,y)=>desc?y.k-x.k:x.k-y.k);
    let sel=[],done=false;const t0=Date.now();
    $("stage").innerHTML=`<div class="mut">라운드 ${r+1} / 5 · 점수 ${sc}</div><div class="big" id="tt">15</div><div class="bar"><i id="tb"></i></div><div class="q">${q}</div><div class="mut" style="text-align:center">다시 누르면 선택이 취소돼요 · 맞힌 자리마다 5점</div><div class="opts" id="ob"></div><div class="row"><button id="sb" disabled>제출</button><button class="g" id="rb">초기화</button></div><div id="fb" style="margin-top:10px;font-weight:700"></div>`;

      let au,c=3;const lbl=r+1>=5?"결과 보기":"다음 라운드";const go=()=>{clearInterval(au);r++;round()};
      const nb=document.createElement("button");const tx=()=>nb.textContent=`${lbl} · ${c}초 뒤 자동 이동`;tx();nb.style.marginTop="10px";nb.onclick=go;$("fb").appendChild(nb);

function ox(){
  const yr=a=>a.y.slice(0,4),ys=[...new Set(ALB.map(yr))];
  const pool=SONGS.filter(s=>!s.intro);
  const pick=()=>pool[Math.random()*pool.length|0];
  const ids=s=>[s.al,...(s.also||[])];
  const mk=()=>{
    const t=Math.random()*3|0,truth=Math.random()<.5;
    if(t===0){const s=pick(),al=truth?A[sh(ids(s))[0]]:sh(ALB.filter(a=>!ids(s).includes(a.id)))[0];
      return {q:`「${s.t}」은(는) <b>${al.n}</b> 수록곡이다`,truth,ex:`${s.t} → ${ids(s).map(i=>A[i].n).join(" / ")}`}}
    if(t===1){const s=pick(),y0=ids(s).map(i=>yr(A[i])),y=truth?sh(y0)[0]:sh(ys.filter(x=>!y0.includes(x)))[0];
      return {q:`「${s.t}」은(는) <b>${y}년</b>에 발표됐다`,truth,ex:`${s.t} → ${ids(s).map(i=>A[i].y+"년").join(" / ")}`}}
    const [a,b]=sh(ALB).slice(0,2),early=a.d<b.d?a:b,late=early===a?b:a,f=truth?early:late,o=truth?late:early;
    return {q:`<b>${f.n}</b>은(는) <b>${o.n}</b>보다 먼저 발매됐다`,truth,ex:`${early.n}(${early.y}) → ${late.n}(${late.y})`}
  };
  const seen=new Set(),items=[];
  while(items.length<10){const m=mk();if(seen.has(m.q))continue;seen.add(m.q);
    items.push({q:m.q,o:["⭕ O","❌ X"],ok:k=>(k===0)===m.truth,ans:(m.truth?"O":"X")+" · "+m.ex})}
  quiz("ox",items,15);
}

    ()=>{const set=sh(MR).slice(0,4),early=Math.random()<.5,sorted=set.slice().sort((a,b)=>a.s.localeCompare(b.s)),tg=early?sorted[0]:sorted[3];

    ()=>{const m=pick(MU),n=MU.indexOf(m)+1,ns=[...Array(MU.length)].map((_,i)=>i+1).filter(x=>x!==n),o=sh([n,...sh(ns).slice(0,3)]);

      return {q:`남우현이 ${y}년에 시작한 뮤지컬은 몇 작품일까요?`,o:o.map(x=>x+"작품"),ok:k=>o[k]===c,ans:`${c}작품${c?" · "+L.map(m=>m.t).join(", "):""} (확인된 목록 기준)`}},
